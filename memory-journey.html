<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>回忆长廊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap');

    * {
      font-family: 'Noto Serif SC', serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fce4ec;
    }

    body {
      position: relative;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
      /* 上浮入场动画 4.5s */
      animation: floatUp 4.5s ease-out forwards;
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(70px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: url('./background3.png') no-repeat center / cover;
    }

    /* ========== 光影流转层 ========== */
    .light-flow {
      position: fixed;
      inset:0;
      z-index:1.5;
      pointer-events:none;
      background: radial-gradient(circle at 20% 30%, rgba(255,220,225,0.35) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255,210,220,0.25) 0%, transparent 35%);
      animation: lightMove 12s ease-in-out infinite alternate;
    }
    @keyframes lightMove {
      0% { transform: translate(-6%,-4%); }
      100% { transform: translate(6%,4%); }
    }

    /* ========== 花瓣容器与花瓣动画 ========== */
    .petal-container {
      position: fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
      overflow:hidden;
    }
    .petal {
      position:absolute;
      background:#ffc8d2;
      border-radius:60% 40% 60% 40%;
      opacity:0.7;
      animation: petalFall linear forwards, petalSway ease-in-out infinite alternate;
    }
    @keyframes petalFall {
      0% {top:-15px; opacity:0.7;}
      90% {opacity:0.6;}
      100% {top:100vh; opacity:0;}
    }
    @keyframes petalSway {
      0% {transform:translateX(-25px) rotate(0deg);}
      100% {transform:translateX(25px) rotate(25deg);}
    }

    .text-wrap {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      gap: 24px;
    }

    .main-title {
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(140, 50, 70, 0.45);
      text-align: center;
    }
    .sub-tip {
      font-size: clamp(0.95rem, 3vw, 1.2rem);
      color: #fff;
      text-shadow: 0 1px 8px rgba(120,30,50,0.4);
      opacity:0.9;
    }

    /* 锁定遮罩 */
    .lock-mask {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: transparent;
      pointer-events: auto;
    }
    .lock-mask.unlock {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="lockMask" class="lock-mask"></div>

  <div class="stage">
    <div class="bg-image"></div>
  </div>

  <!-- 光影流转 -->
  <div class="light-flow"></div>
  <!-- 花瓣容器 -->
  <div class="petal-container" id="petalBox"></div>

  <!-- 文字区域 -->
  <div class="text-wrap">
    <div class="main-title">欢迎来到回忆长廊</div>
    <div class="sub-tip">右滑指向未来，左滑指向过往</div>
  </div>

  <script>
    const lockMask = document.getElementById('lockMask');
    const petalBox = document.getElementById('petalBox');

    // 生成花瓣
    function createPetal(){
      const petal = document.createElement('div');
      petal.classList.add('petal');
      const size = Math.random() * 12 + 6;
      const fallTime = Math.random() * 8 + 7;
      petal.style.width = size + 'px';
      petal.style.height = size * 0.6 + 'px';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.top = '-15px';
      petal.style.animationDuration = `${fallTime}s, ${fallTime}s`;
      petal.style.transform = `rotate(${Math.random()*360}deg)`;
      petalBox.appendChild(petal);
      setTimeout(()=>petal.remove(), fallTime*1000);
    }
    setInterval(createPetal,350);

    // 4.5s解锁手势
    setTimeout(() => {
      lockMask.classList.add('unlock');
    }, 4500);

    // 滑动手势检测
    let touchStartX = 0;
    let touchEndX = 0;
    const minSwipeDistance = 60;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive:true });

    document.addEventListener('touchend', (e) => {
      if(!lockMask.classList.contains('unlock')) return;
      touchEndX = e.changedTouches[0].screenX;
      const deltaX = touchEndX - touchStartX;

      // 右滑：手指从左向右滑，deltaX > 阈值
      if(deltaX > minSwipeDistance){
        window.location.href = "./memory-journey1.html";
      }
    }, { passive:true });

    // 电脑端鼠标模拟：水平拖拽右移跳转
    let mouseDownX = null;
    document.addEventListener('mousedown',e=>{
      mouseDownX = e.clientX;
    });
    document.addEventListener('mouseup',e=>{
      if(!lockMask.classList.contains('unlock') || mouseDownX === null) return;
      const dx = e.clientX - mouseDownX;
      if(dx>minSwipeDistance){
        window.location.href = "./memory-journey1.html";
      }
      mouseDownX = null;
    });
  </script>
</body>
</html>
