<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>回忆长廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:"Noto Serif SC",serif;color:#fff;}

/* 粒子画布 金黄色圆形柔光粒子 */
#petalCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:2;}

/* 页面容器 */
.wrapper{
  width:100vw;height:100vh;
  position:relative;overflow:hidden;
}
.page-wrap{
  width:100vw;height:100vh;
  position:absolute;top:0;left:0;
  transition: transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.page{
  width:100vw;height:100vh;
  position:absolute;top:0;left:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  padding: 12vh 8vw;
}
/* 入场朦胧模糊 4.5s */
.init-blur{
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  animation: clearBlur 4.5s ease-out forwards;
}
@keyframes clearBlur {
  0%{backdrop-filter: blur(18px);-webkit-backdrop-filter: blur(18px);}
  100%{backdrop-filter: blur(0px);-webkit-backdrop-filter: blur(0px);}
}

/* 文字容器 */
.text-box{position:relative;z-index:3;line-height:1.8rem;font-size:1.1rem;}
/* TypeA 逐字淡入 */
.char{opacity:0;animation: charFade 0.4s ease forwards;display:inline-block;}
@keyframes charFade{to{opacity:1;}}
/* 特殊大号数字：随机渐显 */
.num-big{
  font-size:1.6em;
  font-weight:600;
  opacity:0;
  animation: numRandomFade 1.2s ease forwards;
}
@keyframes numRandomFade{
  0%{transform:scale(0.8);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}

/* TypeB 底部提示文字 */
.bottom-tip{
  position:absolute;bottom:16vh;left:50%;transform:translateX(-50%);
  opacity:0;transition:opacity 0.8s;
  font-size: 1rem;letter-spacing:2px;color:#f8f3e4;
  z-index:4;
}
/* TypeB 全屏向上扩散模糊遮罩 */
.blur-mask{
  position:absolute;width:100vw;height:100vh;top:0;left:0;
  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(0px);
  transition: backdrop-filter 1.2s ease-out,-webkit-backdrop-filter 1.2s ease-out;
  pointer-events:none;z-index:1;
}
.blur-mask.active{
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

/* 翻页箭头 */
.arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:2.4rem;color:#fff8e0;opacity:0.6;
  z-index:10;padding:1rem;
  transition:opacity 0.3s;
  user-select:none;
}
.arrow:active{opacity:1;}
.arrow-left{left:4vw;}
.arrow-right{right:4vw;}
.back-home{
  position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);
  font-size:0.95rem;color:#fff8e0;text-decoration:underline;
  z-index:10;opacity:0.7;
}

</style>
</head>
<body>
<!-- 粒子画布 -->
<canvas id="petalCanvas"></canvas>

<!-- 背景音乐 -->
<audio id="bgMusic" src="mother.mp3" loop preload="auto">

<div class="wrapper init-blur">
  <div class="page-wrap" id="pageWrap">
    <!--P1 TypeA：6057 大号随机渐显-->
    <section class="page" data-page="1" data-type="A" data-bg="P1.png">
      <div class="text-box">
        <p class="text-content"><span class="num-big" style="animation-delay:0.2s">6057</span>天前，您赐予我了生命，在一片玉兰花海之中。</p>
      </div>
    </section>
    <!--P2 TypeA：16大号随机渐显-->
    <section class="page" data-page="2" data-type="A" data-bg="P2.png">
      <div class="text-box">
        <p class="text-content">时至今日，我们共同走过的，是<span class="num-big" style="animation-delay:0.2s">16</span>个秋天：</p>
      </div>
    </section>
    <!--P3 TypeA：47、1/3大号随机渐显-->
    <section class="page" data-page="3" data-type="A" data-bg="P3.png">
      <div class="text-box">
        <p class="text-content">在您生命的第<span class="num-big" style="animation-delay:0.2s">47</span>个秋天里，我谨献上在其<span class="num-big" style="animation-delay:0.4s">1/3</span>的时光里的生命回响。</p>
      </div>
    </section>
    <!--P4 TypeA-->
    <section class="page" data-page="4" data-type="A" data-bg="P4.png">
      <div class="text-box">
        <p class="text-content">此时银杏尚未换装，桂花尚未飘香，而秋风已然送走了夏末的最后一缕燥热，迎接着这个神圣的日子。我曾开玩笑：“杭州有春花烂漫，却没有秋风送爽。”殊不知在这转瞬即逝的秋风中才真正蕴育着新生——木樨洒绿叶，菊花傲立寒风，果实酣睡枝头。这个季节虽短，却已承载着生命的使命；而当她与世界邂逅，将许我祝福的风准时莅临。</p>
      </div>
    </section>
    <!--P5 TypeA-->
    <section class="page" data-page="5" data-type="A" data-bg="P5.png">
      <div class="text-box">
        <p class="text-content">站在时光这头回望，在这个生机的季节里拨回时间，却走进了一条漫无尽头的走廊，而我能踏足的，区区十余年罢了。很抱歉这个十六岁的少年追溯不了太久远的历史，抑或很抱歉每忆此时皆惟此般回忆，但我希望伴我走过的巨载岁月，能折射出时光中的那缕清欢，照在今日依旧能带来温暖。</p>
      </div>
    </section>
    <!--P6 TypeA-->
    <section class="page" data-page="6" data-type="A" data-bg="P6.png">
      <div class="text-box">
        <p class="text-content">您曾爱过一片片海，而今天，人间所有的海将献上最无垠的祝福。她来自咸淡中的红海与波罗的，来自太平的深沉，来自地中的静谧与北冰洋的庄重。那是一片无疆的幸福之海，随着波浪将幸运从天边递至面前。</p>
      </div>
    </section>
    <!--P7 TypeA-->
    <section class="page" data-page="7" data-type="A" data-bg="P7.png">
      <div class="text-box">
        <p class="text-content">那是远方矗立的山。有林加尼一次次生机着大地最深处的脉搏，亦有巴尔干默藏着峡湾隐秘处的年轮。他们是常驻的青春，不管为自然之伟力抑或人间之神造，生命流淌无息无止。那是山间最澄澈的晨光，岁月深处，您青春永驻。</p>
      </div>
    </section>
    <!--P8 TypeB-->
    <section class="page" data-page="8" data-type="B" data-bg="P8.png">
      <div class="blur-mask"></div>
      <div class="bottom-tip">上拉显示文字</div>
      <div class="text-box">
        <p class="text-content">在那里，有一场期许，是一条来路。这一程，我们共同走过。一年年不过回眸之间，从刚学会说话到挥墨成此信，不过弹指之挥。没有人握得住时光，但我们可以并肩踏出生活的规律。我金榜题名，您为我骄傲；我摘星而归，您为我喝彩；而当我落入迷茫，您亦为此焦虑不堪。其实您本应过您的生活，但您选择了只身擎起家庭。我总是想要感恩，想要承受一份重量，但总是不知所措。我希望您能过得开心一点，不要再为我焦虑，可每次成绩与现实总是赤裸裸地摆在眼前，在黑暗中挣扎却总力不从心。而我明白，我奋斗的背后有您，有一个家，每一笔落下都承载着家人的重望。所以我会全力以赴，尽我所能去追逐梦想。您总说当时或现在会有多苦，我终会懂的，但也希望您能理解一个十六岁少年在暗夜中行总会遇之迷惘；而迷惘过后总会爬起，蹒跚向前。希望您不用望穿我的背影，为每一个波动焦虑，希望您能生活得开心一些，给我一些时间，待我与您共同奔赴可期的未来。［注：作此段时，心声澎湃，有失所言，敬请谅解］</p>
      </div>
    </section>
    <!--P9 TypeB-->
    <section class="page" data-page="9" data-type="B" data-bg="P9.png">
      <div class="blur-mask"></div>
      <div class="bottom-tip">上拉显示文字</div>
      <div class="text-box">
        <p class="text-content">实为人间。我们曾仰望过同一片星空，无数繁星之中，我们平凡，我们渺小，我们相依，我们彼此是夜空中最璀璨的一环，心心相扣。我们一生中要邂逅不下上万人，可真正流转心底之人，寥寥无几。而正因客居人间，仅吾母子相依，我们才会懂得彼此之意义。您陪伴我慢慢成长与蜕变，而我则为您的人生平添几抹乐趣与意义。您自嘲：“带娃时要吃好的，娃长大后把最好的都给媳妇了。”但也请您相信，那时的我不会忘却，身后的路和您陪我走过的童年与青春。我或许不能将此间所有的爱报答，可我终究不会忘记有私情。另一半终究是身外之人，仅能伴一行行路；而您曾赐以我生命，赋以我灵魂，伴以我成熟，望以我赴远，我怎会忘却人间最温暖、最无私的陪伴，漫漫长路我们一同走过，我即是您的一部分，而您亦赐我最重要的生命，母子之爱即为世间人间最温暖最壮美的爱。此恩我将终身铭记，报之一世，亦望您待几余年之花开，我将前行不辍，便让我于今时奉上这炽热的爱！</p>
      </div>
    </section>
    <!--P10 TypeB 粒子停止生成-->
    <section class="page" data-page="10" data-type="B" data-bg="P10.png" data-particle-stop="true">
      <div class="blur-mask"></div>
      <div class="bottom-tip">上拉显示文字</div>
      <div class="text-box">
        <p class="text-content">行至暮色，将穿越三年的长夜以蓄力，迎接两年后的破晓。而暗夜行走，不免多少惘惘。天色渐暗，我曾听信旁人谗言，语入歧途，酿作误会，把长夜的寂寞单方面归作所谓“缺爱”，我在此深感忏悔。而“悟已往之不谏，知来者之可追”，今日之我，已重新锁定航向，望今后之努力，可弥补昨日之缺憾。实感途途其未远，觉今是而昨非。于今时回望，再拾既往时言语，竟觉可笑亦可悲。家庭成分缺失从不是心头的剧痛，反之，其使您我母子之爱更加厚重与珍贵，而这份关怀与疼爱，已远超其他无数家庭。这是一种不同的人生体验，它教会人爱的意义，亦磨炼人之心志，让我们坚强乐观，这让我们共同攀过的这条路更加珍重而壮美，每一个脚印都饱含了面对生活与梦想的不屈与向往，饱含着我们心中的灵犀。此刻，愿此路延伸向诗与远方。</p>
      </div>
    </section>
    <!--P11 TypeB 粒子重启-->
    <section class="page" data-page="11" data-type="B" data-bg="P11.png" data-particle-restart="true">
      <div class="blur-mask"></div>
      <div class="bottom-tip">上拉显示文字</div>
      <div class="text-box">
        <p class="text-content">于是终于走向了未来。这是怎样一个未来，让我们将春花秋月皆错过。在那个时空中，或许我会远行奔赴山海，或许我会扎根故土——或许我们会走散，或许我们会在忙碌的行色间紧紧相依。纵使寰宇苍茫，我们总会准时相遇。一人海汹涌，我们皆为彼此光亮的星。流星划过秋的月夜，把这份美好，捎给未来每一个日夜。</p>
      </div>
    </section>
    <!--P12 TypeA-->
    <section class="page" data-page="12" data-type="A" data-bg="P12.png">
      <div class="text-box">
        <p class="text-content">我走过了粉沉的花海，走过了回忆的长路，于是再踏回了这个秋天。</p>
      </div>
    </section>
    <!--P13 TypeA-->
    <section class="page" data-page="13" data-type="A" data-bg="P13.png">
      <div class="text-box">
        <p class="text-content">秋默无声息地牵起了夏与冬的手——炎热随霜叶褪去，而寒冷夹带着天高阳平的温存，那是激荡后的沉寂，没有燥火的冲动，却留下无声的浪漫；是黑白中的彩，在霜雪降临前抹了一叶光；是一场修行的前奏，倾听足山间回响的歌；是一程漫旅的果，于土地上蔓延开收获引漾起的嘴角。相信四十七年前，池塘的稻香了，金黄的田野蕴育着注定伟大的生命，在平凡的暗夜中走出不凡的人生。走过秋收后的寒冬，又在一个春花烂漫之时将另一个生命带入人间，于是又在坚守与爱的稻海中走过十余秋天。或许杭州的秋天并没田野中热烈，亦无稻香蔓延至这座城市深处，但秋的生机早在劳碌的背影里扎根，当汗水将家庭的命运引向更远的远方，在它摘下的净土，绽放的泪花迸溅出秋的庄重，在沃土深处静静埋藏一颗最饱满的种子。当它熬过寒冬，在那命中注定的春天，会有怒放的花，用生命迸溅着曾经每一个坎坷聚成的露，滋润回首曾经成长过的汗与土，当它舒展开艳世的瓣与蕊，他不曾忘记，那一秋，那一滴汗，那个并肩走过的寒冬。</p>
      </div>
    </section>
    <!--P14 TypeA-->
    <section class="page" data-page="14" data-type="A" data-bg="P14.png">
      <div class="text-box">
        <p class="text-content">彼时桂花会香的，也会有一个少年，折下那最高最美一枝，赠予深爱着的母亲。银杏会如约变黄，却有火团中的枫叶奏着炽热的曲。霜尚未落下而菊却无视那随时降临的冬与长夜巍巍绽放。生命从未退场，青春未曾枯黄，就让大雁衔去丰收与欢喜，庄严地向远方宣布：这将是一场永恒。生命、陪伴、幸福、爱。</p>
      </div>
    </section>
    <!--P15 TypeA-->
    <section class="page" data-page="15" data-type="A" data-bg="P15.png">
      <div class="text-box">
        <p class="text-content">生命与陪伴与幸福与爱。</p>
      </div>
    </section>
    <!--P16 TypeA-->
    <section class="page" data-page="16" data-type="A" data-bg="P16.png">
      <div class="text-box">
        <p class="text-content">海依旧在回荡，在波涛中叙述寰宇的无垠，山依旧在起伏，高歌的山峦延伸向无尽的远方。岁月未曾停下匆匆的步履，而爱始终在人间牢牢扎根。</p>
      </div>
    </section>
    <!--P17 TypeA-->
    <section class="page" data-page="17" data-type="A" data-bg="P17.png">
      <div class="text-box">
        <p class="text-content">候鸟伴着笙歌将桂雨洒落人间，一场烟火，一场邂逅。纷飞的银杏在稻浪间织起金黄的河，惟有枫叶用火燃烧着昨夜方凝的霜。</p>
      </div>
    </section>
    <!--P18 TypeA-->
    <section class="page" data-page="18" data-type="A" data-bg="P18.png">
      <div class="text-box">
        <p class="text-content">此时，秋风或已将满载的期许送至，于是我们拥有了四季。那是祝福，在生活中最无声的秩序；是如愿，点亮每一道蹒跚前行的背影；是幸运，在时光背后觉得的琐碎确幸；是健朗，以青春的姿态跋涉岁月长河；是陪伴，于路漫漫中有一双厚重的肩；是温暖，行走着人生的幸福与爱。</p>
      </div>
    </section>
    <!--P19 TypeA-->
    <section class="page" data-page="19" data-type="A" data-bg="P19.png">
      <div class="text-box">
        <p class="text-content">寒来暑往，风霜雨雪，树在秋林中漾开岁月的年轮——哪一年风调雨顺，哪一年饱经风霜。时光中一个个秋不会忘记，每一夕走过的人间。回忆将如这年轮徐徐伸展，岁月深处，永不褪色，托举着我们的人生向远方延伸。所以不妨记下这一年年的秋实，任其在时光的角落里释放人情中最暖的光，带着今日最美的祝福，伴随此生：愿万事顺遂，愿青春永驻，愿幸福幸运，愿子折桂枝，愿如意安康，愿深爱长存……</p>
      </div>
    </section>
    <!--P20：仅左侧箭头 + 返回主页链接，生日快乐按要求不显示 -->
    <section class="page" data-page="20" data-type="A" data-bg="P20.png">
      <div class="text-box">
        <p class="text-content"></p>
      </div>
      <a class="back-home" href="index.html">返回主页</a>
    </section>
  </div>
  <!-- 箭头容器 -->
  <div class="arrow arrow-left" id="arrowLeft">&lt;</div>
  <div class="arrow arrow-right" id="arrowRight">&gt;</div>
</div>

<script>
// ========== 粒子系统 金黄色圆形，透明度0.25；P10停止新建粒子，P11重启 ==========
const canvas = document.getElementById('petalCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
let particleList = [];
let enableSpawn = true;

class Particle{
  constructor(){
    this.x = Math.random() * canvas.width;
    this.y = -20;
    this.radius = Math.random() * 10 + 4;
    this.opacity = 0.25;
    this.speedY = Math.random() * 0.6 +0.3;
    this.speedX = Math.random() * 0.4 -0.2;
  }
  update(){
    this.y += this.speedY;
    this.x += this.speedX;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,215,80,${this.opacity})`;
    ctx.fill();
  }
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(enableSpawn && particleList.length < 40){
    particleList.push(new Particle());
  }
  for(let i=particleList.length-1;i>=0;i--){
    const p = particleList[i];
    p.update();p.draw();
    if(p.y>canvas.height) particleList.splice(i,1);
  }
  requestAnimationFrame(render);
}
render();

// ========== 全局变量 ==========
const totalPage = 20;
let currentPage = 1;
let touchStartX=0,touchStartY=0;
let isMoving = false;
const pageWrap = document.getElementById('pageWrap');
const arrowLeft = document.getElementById('arrowLeft');
const arrowRight = document.getElementById('arrowRight');
const allPages = Array.from(document.querySelectorAll('.page'));
const audio = document.getElementById('bgMusic');

// 初始化页面背景
function applyPage(pageIdx){
  allPages.forEach(p=>{
    const pNum = Number(p.dataset.page);
    p.style.backgroundImage = `url(${p.dataset.bg})`;
    p.style.display = pNum===pageIdx ? "block":"none";
  })
  // 粒子开关判断
  const currDom = allPages.find(x=>Number(x.dataset.page)===pageIdx);
  if(currDom.dataset.particleStop === "true") enableSpawn = false;
  if(currDom.dataset.particleRestart === "true") enableSpawn = true;
  // 箭头显示控制
  arrowLeft.style.display = pageIdx === 1 ? "none":"block";
  arrowRight.style.display = pageIdx === totalPage ? "none":"block";
  // 文字逐字动画
  runTextAnim(currDom);
  // TypeB：1秒后弹出底部提示
  if(currDom.dataset.type === "B"){
    setTimeout(()=>{
      const tip = currDom.querySelector('.bottom-tip');
      if(tip) tip.style.opacity = 1;
    },1000);
  }
}

// 逐字拆分淡入（跳过num‑big标签内部文本）
function runTextAnim(pageDom){
  const txtEl = pageDom.querySelector('.text-content');
  const htmlRaw = txtEl.innerHTML;
  txtEl.innerHTML = "";
  let tempDiv = document.createElement('div');
  tempDiv.innerHTML = htmlRaw;

  function traverse(node){
    if(node.nodeType === Node.TEXT_NODE){
      const text = node.textContent;
      for(let i=0;i<text.length;i++){
        const span = document.createElement('span');
        span.className = "char";
        span.textContent = text[i]===" "?" ":text[i];
        span.style.animationDelay = `${i*0.06}s`;
        txtEl.appendChild(span);
      }
    }else if(node.nodeType === Node.ELEMENT_NODE){
      if(node.classList.contains("num-big")){
        txtEl.appendChild(node.cloneNode(true));
      }else{
        for(let child of node.childNodes){
          traverse(child);
        }
      }
    }
  }
  for(let n of tempDiv.childNodes){traverse(n);}
}

// TypeB 上拉触发模糊+文字动画
function triggerTypeB(pageDom){
  const mask = pageDom.querySelector('.blur-mask');
  const tip = pageDom.querySelector('.bottom-tip');
  if(mask){mask.classList.add('active');}
  if(tip){tip.style.opacity=0;}
  runTextAnim(pageDom);
}

// 页面切换逻辑
function goPage(target){
  if(target<1 || target>totalPage) return;
  if(target>currentPage){
    pageWrap.style.transform = "translateX(-100vw)";
  }else{
    pageWrap.style.transform = "translateX(100vw)";
  }
  setTimeout(()=>{
    currentPage = target;
    pageWrap.style.transition = "none";
    pageWrap.style.transform = "translateX(0)";
    applyPage(currentPage);
    setTimeout(()=>{
      pageWrap.style.transition = "transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1)";
    },50);
  },700);
}

// 手势监听
document.addEventListener('touchstart',e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchmove',e=>{
  isMoving=true;
});
document.addEventListener('touchend',e=>{
  const endX = e.changedTouches[0].clientX;
  const endY = e.changedTouches[0].clientY;
  const dx = endX-touchStartX;
  const dy = endY-touchStartY;
  const threshold = 60;
  const currDom = allPages.find(x=>Number(x.dataset.page)===currentPage);

  // TypeB 上拉（dy>阈值，手指向上滑）触发文字
  if(currDom.dataset.type==="B" && dy>threshold){
    triggerTypeB(currDom);
    return;
  }

  // 横向滑动：dx>60 →手指从左向右【右拉】=上一页；dx<-60 →手指从右向左【左拉】=下一页
  if(Math.abs(dx)>threshold && Math.abs(dx)>Math.abs(dy)){
    if(dx>threshold){goPage(currentPage-1);}
    else if(dx<-threshold){goPage(currentPage+1);}
  }
  isMoving=false;
});

// 箭头点击
arrowLeft.onclick = ()=>goPage(currentPage-1);
arrowRight.onclick = ()=>goPage(currentPage+1);

// 背景音乐自动播放（移动端需要用户首次交互解锁）
document.addEventListener('click',()=>{
  if(audio.paused) audio.play().catch(e=>{});
},{once:true});
document.addEventListener('touchend',()=>{
  if(audio.paused) audio.play().catch(e=>{});
},{once:true});

// 初始化第一页
applyPage(currentPage);
</script>
</body>
