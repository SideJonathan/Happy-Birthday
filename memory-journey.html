<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>回忆长廊</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:"Noto Serif SC",serif;color:#ffffff;}

#petalCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:2;}

.bg-wrap{
  position:fixed;inset:0;z-index:0;
}
.bg-layer{
  position:absolute;inset:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0;
  transition: opacity 1.2s ease-in-out;
}
.bg-layer.active{opacity:1;}
/* 图片遮罩层 */
.bg-layer .mask{
  position:absolute;inset:0;
  background-color:rgba(0,0,0,0.32);
}

.lyric-wrap{
  position:fixed;inset:0;z-index:3;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding: 12vh 6vw;
  pointer-events:none;
  overflow:hidden;
}

.lyric-prev,
.lyric-next{
  font-size:0.8rem;
  opacity:0.4;
  filter: blur(4px);
  transform: scale(0.85);
  text-align:center;
  color:#fff;
  max-width: 780px;
}
.lyric-prev{
  margin-bottom: 1.4rem;
}
.lyric-next{
  margin-top: 1.4rem;
}

.lyric-current{
  font-size:1.15rem;
  line-height:1.8;
  text-align:center;
  color:#ffffff;
  max-width: 780px;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.lyric-current.show{
  opacity: 1;
}

.char{opacity:0;animation: charFade 0.4s ease forwards;display:inline-block;}
@keyframes charFade{to{opacity:1;}}
.num-big{
  font-size:1.6em;
  font-weight:600;
}

.hit-top{
  position:fixed;top:0;left:0;width:100vw;height:33vh;z-index:5;
}
.hit-middle{
  position:fixed;top:33vh;left:0;width:100vw;height:34vh;z-index:5;
}
.hit-bottom{
  position:fixed;bottom:0;left:0;width:100vw;height:33vh;z-index:5;
}
.lock .hit-top,.lock .hit-bottom{pointer-events:none;}

/* ========== 新增 返回主页按钮样式 ========== */
.home-tip{
  position:fixed;
  bottom:10vh;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:#fff;
  font-size:0.9rem;
  opacity:0;
  transition: opacity 1.2s ease;
  cursor:pointer;
  text-align:center;
  letter-spacing:2px;
  pointer-events:none;
}
.home-tip.show{
  opacity:0.75;
  pointer-events:auto;
}
.home-tip:hover{
  opacity:1;
}
</style>
</head>
<body>
<canvas id="petalCanvas"></canvas>
<div class="bg-wrap" id="bgWrap"></div>

<div class="lyric-wrap" id="lyricWrap">
  <div class="lyric-prev" id="prevText"></div>
  <div class="lyric-current" id="currText"></div>
  <div class="lyric-next" id="nextText"></div>
</div>

<!-- 返回主页提示 -->
<div class="home-tip" id="homeTip">点击返回首页</div>

<div class="hit-top" id="hitTop"></div>
<div class="hit-middle"></div>
<div class="hit-bottom" id="hitBottom"></div>

<audio id="bgMusic" src="mother.mp3" loop preload="auto">

<script>
const canvas = document.getElementById('petalCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight;}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
let particleList=[];
let enableSpawn=true;

class Particle{
  constructor(){
    this.x=Math.random()*canvas.width;
    this.y=-20;
    this.radius=Math.random()*10+4;
    this.opacity=0.25;
    this.speedY=Math.random()*0.6+0.3;
    this.speedX=Math.random()*0.4-0.2;
  }
  update(){this.y+=this.speedY;this.x+=this.speedX;}
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,215,80,${this.opacity})`;
    ctx.fill();
  }
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(enableSpawn && particleList.length<40) particleList.push(new Particle());
  for(let i=particleList.length-1;i>=0;i--){
    const p=particleList[i];
    p.update();p.draw();
    if(p.y>canvas.height) particleList.splice(i,1);
  }
  requestAnimationFrame(render);
}
render();

const pageData=[
  {page:1,bg:"./p1.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content"><span class="num-big">6057</span>天前，您赐予我了生命，在一片玉兰花海之中。</p>`},
  {page:2,bg:"./p2.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">时至今日，我们共同走过的，是<span class="num-big">16</span>个秋天：</p>`},
  {page:3,bg:"./p3.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">在您生命的第<span class="num-big">47</span>个秋天里，我谨献上在其<span class="num-big">1/3</span>的时光里的生命回响。</p>`},
  {page:4,bg:"./p4.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">此时银杏尚未换装，桂花尚未飘香，而秋风已然送走了夏末的最后一缕燥热，迎接着这个神圣的日子。我曾开玩笑：“杭州有春花烂漫，却没有秋风送爽。”殊不知在这转瞬即逝的秋风中才真正蕴育着新生——木樨星洒绿叶，菊花傲立寒风，果实酣睡枝头。这个季节虽短，却已承载着生命的使命；而当她与世界邂逅，将许我祝福的风准时莅临。</p>`},
  {page:5,bg:"./p5.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">站在时光这头回望，在这个生机的季节里拨回时间，却走进了一条漫无尽头的走廊，而我能踏足的，区区十余年罢了。很抱歉这个十六岁的少年追溯不了太久远的历史，抑或很抱歉每岁此时皆惟此般回忆，但我希望伴我走过的区载岁月，能折射出时光中的那缕清欢，照在今日依旧能带来温暖。</p>`},
  {page:6,bg:"./p6.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">您曾爱过一片片海，而今天，人间所有的海将献上最无垠的祝福。她来自咸淡中的红海与波罗的，来自太平的深沉，来自地中的静谧与北冰的庄重。那是一片无疆的幸福之海，随着波浪将幸运从天边递至面前。</p>`},
  {page:7,bg:"./p7.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">那是远方矗立的山。有林加尼一次次生机着大地最深处的脉搏，亦有巴尔干默藏着峡湾隐秘处的年轮。他们是常驻的青春，不管为自然之伟力抑或人间之神造，生命流淌无息无止。那是山间最澄澈的晨光，岁月深处，您青春永驻。</p>`},
  {page:8,bg:"./p8.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">在那里，有一场期许，是一条来路。这一程，我们共同走过。一年年不过回眸之间，从刚学会说话到挥墨成此信，不过弹指之挥。没有人握得住时光，但我们可以并肩踏出生活的旋律。我金榜题名，您为我骄傲；我摘星而归，您为我喝彩；而当我落入迷茫，您亦为此焦虑不堪。其实您本应过您的生活，但您选择了只身擎起家庭。我总是想要感恩，想要承受一份重量，但总是不知所措。我希望您能过得开心一点，不要再为我焦虑，可每次成绩与现实总是赤裸裸地摆在眼前，在黑暗中挣扎却总力不从心。而我明白，我奋斗的背后有您，有一个家，每一笔落下都承载着家人的重望。所以我会全力以赴，尽我所能去追逐梦想。您总说当时或现在会有多苦，我终会懂的，但也希望您能理解一个十六岁少年在暗夜中行总会遇之迷惘；而迷惘过后总会爬起，蹒跚向前。希望您不用望穿我的背影，为每一个波动焦虑，希望您能生活得开心一些，给我一些时间，待我与您共同奔赴可期的未来。［注：作此段时，心声澎湃，有失所言，敬请谅解］</p>`},
  {page:9,bg:"./p9.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">实为人间。我们曾仰望过同一片星空，无数繁星之中，我们平凡，我们渺小，我们相依，我们彼此是夜空中最璀璨的一环，心心相扣。我们一生中要邂逅不下上万人，可真正流转心底之人，寥寥无几。而正因客居人间，仅吾母子相依，我们才会懂得彼此之意义。您陪伴我慢慢成长与蜕变，而我则为您的人生平添几抹乐趣与意义。您自嘲：“带娃时要吃好些，娃长大后把最好的都给媳妇了。”但也请您相信，那时的我不会忘却，身后的路和您陪我走过的童年与青春。我或许不能将此间所有的爱报答，可我终究不会忘记乌鸟私情。另一半终究是身外之人，仅能伴一程行路；而您曾赐以我生命，赋以我灵魂，伴以我成熟，望以我赴远，我怎会忘却人间最温暖、最无私的陪伴，漫漫长路我们一同走过，我即是您的一部分，而您亦赐我最重要的生命，母子之爱即为世间人间最温暖最壮美的爱。此恩我将终身铭记，报之一世，亦望您待几余年之花开，我将前行不辍，便让我于今时奉上这炽热的爱！</p>`},
  {page:10,bg:"./p10.png",particleStop:true,particleRestart:false,
    html:`<p class="text-content">行至暮色，将穿越三年的长夜以蓄力，迎接两年后的破晓。而暗夜行走，不免多少凄惘。天色渐暗，我曾听信佞人谗言，误入歧途，酿作误会，把长夜的寂寞单方面归作所谓“缺爱”，我在此深感忏悔。而“悟已往之不谏，知来者之可追”，今日之我，已重新锚定航向，望今后之努力，可弥补昨日之缺憾。实迷途其未远，觉今是而昨非。于今时回望，再拾此往时言语，竟觉可笑亦可悲。家庭成分缺失从不是心头的创痛，反之，其使您我母子之爱更加厚重与珍贵，而这份关怀与疼爱，已远超其他无数家庭。这是一种不同的人生体验，它教会人爱的意义，亦磨炼人之心志，让我们坚强乐观，这让我们共同攀过的这条路更加珍重而壮美，每一个脚印都饱含了面对生活与梦想的不屈与向往，饱含着我们心中的灵犀。此刻，愿此路延伸向诗与远方。</p>`},
  {page:11,bg:"./p11.png",particleStop:false,particleRestart:true,
    html:`<p class="text-content">于是终于走向了未来。这是怎样一个未来，让我们将春花秋月皆错过。在那个时空中，或许我会远行奔赴山海，或许我会扎根故土——或许我们会走散，或许我们会在忙碌的行色间紧紧相依。纵使寰宇苍茫，我们总会准时相遇——人海汹涌，我们皆为彼此最亮的星。流星划过秋的月夜，把这份美好，捎给未来每一个日夜。</p>`},
  {page:12,bg:"./p12.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">我走过了粉红的花海，走过了回忆的长路，于是再踏回了这个秋天。</p>`},
  {page:13,bg:"./p13.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">秋默无声息地牵起了夏与冬的手——炎热随霜叶褪去，而寒冷夹带着天高暖阳中的温存，那是激荡后的沉寂，没有燥火的冲动，却留下无声的浪漫；是黑白中的彩，在霜雪降临前抹了一叶火；是一场修行的前奏，倾听足山间回响的歌；是一程漫旅的果，于土地上蔓延开收获与漾起的嘴角。相信四十七年前，沈湾的稻香了，金黄的田野蕴育着注定伟大的生命，在平凡的暗夜中走出不凡的人生。走过秋收后的寒冬，又在一个春花烂漫之时将另一个生命带入人间，于是又在坚守与爱的稻海中走过十余秋天。或许杭州的秋天并没田野中热烈，亦无稻香蔓延至这座城市深处，但秋的生机早在劳碌的背影里扎根，当汗水将家庭的命运引向更远的远方，在它滴下的净土，绽放的泪花迸溅出秋的庄重，在沃土深处静静埋藏一颗最饱满的种子。当它熬过寒冬，在那命中注定的春天，会有怒放的花，用生命迸溅着曾经每一个坎坷聚成的露，滋润回曾经成长过的汗与土，当它舒展开艳世的瓣与蕊，他不曾忘记，那一秋，那一滴汗，那个并肩走过的寒冬。</p>`},
  {page:14,bg:"./p14.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">彼时桂花会香的，也会有一个少年，折下那最高最美一枝，赠予深爱着的母亲。银杏会如约变黄，却有火团中的枫叶奏着炽热的曲。霜尚未落下、而菊却无视那随时降临的冬与长夜巍峨绽放。生命从未退场，青春未曾枯黄，就让大雁衔去丰收与欢喜，庄严地向远方宣布：这将是一场永恒。生命、陪伴、幸福、爱。</p>`},
  {page:15,bg:"./p15.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">生命与陪伴与幸福与爱。</p>`},
  {page:16,bg:"./p16.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">海依旧在回荡，在波涛中叙述寰宇的无垠，山依旧在起伏，高歌的山峦延伸向无尽的远方。岁月未曾停下匆匆的步履，而爱始终在人间牢牢扎根。</p>`},
  {page:17,bg:"./p17.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">候鸟伴着笙歌将桂雨洒落人间，一场烟火，一场邂逅。纷飞的银杏在稻浪间织起金黄的河，惟有枫叶用火燃烧着昨夜方凝的霜。</p>`},
  {page:18,bg:"./p18.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">此时，秋风或已将满载的期许送至，于是我们拥有了四季。那是祝福，在生活中最无声的狭隙；是如愿，点亮每一道蹒跚前行的背影；是幸运，在时光背后觅得的琐碎确幸；是健朗，以青春的姿态跋涉岁月长河；是陪伴，于路漫漫中有一双厚重的肩；是温暖，行走着人生的幸福与爱。</p>`},
  {page:19,bg:"./p19.png",particleStop:false,particleRestart:false,
    html:`<p class="text-content">寒来暑往，风霜雨雪，树在秋林中漾开岁月的年轮——哪一年风调雨顺，哪一年饱经风霜。时光中一个个秋不会忘记，每一夕走过的人间。回忆将如这年轮徐徐伸展，岁月深处，永不褪色，托举着我们的人生向远方延伸。所以不妨记下这一年年的秋实，任其在时光的角落里释放人情中最暖的光，带着今日最美的祝福，伴随此生：愿万事顺遂，愿青春永驻，愿幸福幸运，愿子折桂枝，愿如意安康，愿深爱长存……</p>`},
  {page:20,bg:"./p20.png",particleStop:false,particleRestart:false,
    html:``}
];

const bgWrap = document.getElementById("bgWrap");
const prevTextEl = document.getElementById("prevText");
const currTextEl = document.getElementById("currText");
const nextTextEl = document.getElementById("nextText");
const hitTop = document.getElementById("hitTop");
const hitBottom = document.getElementById("hitBottom");
const homeTip = document.getElementById("homeTip");

let currentPage = 1;
const totalPage = 20;
let isAnimating = false;

// 返回首页点击事件
homeTip.onclick = ()=>{
  window.location.href = "index.html";
}

function buildBgLayers(){
  pageData.forEach(p=>{
    const div=document.createElement("div");
    div.className="bg-layer";
    div.style.backgroundImage=`url(${p.bg})`;
    div.dataset.page=p.page;
    // 只有非P20页面添加暗色遮罩
    if(p.page !== 20){
      const maskDom = document.createElement("div");
      maskDom.className = "mask";
      div.appendChild(maskDom);
    }
    bgWrap.appendChild(div);
  })
}
buildBgLayers();

function renderTypeB(htmlStr,targetEl){
  targetEl.innerHTML="";
  if(!htmlStr) return;

  const temp=document.createElement('div');
  temp.innerHTML=htmlStr;
  let charIndex=0;
  const delayStep=0.06;
  function traverse(node){
    if(node.nodeType===Node.TEXT_NODE){
      const t=node.textContent;
      for(let i=0;i<t.length;i++){
        const span=document.createElement('span');
        span.className="char";
        span.textContent=t[i]===" "?" ":t[i];
        span.style.animationDelay = `${charIndex*delayStep}s`;
        targetEl.appendChild(span);
        charIndex++;
      }
    }else if(node.nodeType===Node.ELEMENT_NODE){
      const isBig=node.classList.contains("num-big");
      const text=node.textContent;
      for(let i=0;i<text.length;i++){
        const span=document.createElement('span');
        span.className= isBig ? "char num-big" : "char";
        span.textContent=text[i]===" "?" ":text[i];
        span.style.animationDelay = `${charIndex*delayStep}s`;
        targetEl.appendChild(span);
        charIndex++;
      }
    }
  }
  [...temp.childNodes].forEach(n=>traverse(n));
}

function updatePrevNext(){
  const prevData = pageData.find(x=>x.page===currentPage-1);
  const nextData = pageData.find(x=>x.page===currentPage+1);

  prevTextEl.innerHTML = prevData ? prevData.html : "";
  nextTextEl.innerHTML = nextData ? nextData.html : "";
}

async function renderPage(pageNum){
  if(isAnimating) return;
  isAnimating=true;
  document.body.classList.add("lock");

  const currData = pageData.find(x=>x.page===pageNum);
  if(currData.particleStop) enableSpawn=false;
  if(currData.particleRestart) enableSpawn=true;

  document.querySelectorAll(".bg-layer").forEach(l=>l.classList.remove("active"));
  const activeBg = document.querySelector(`.bg-layer[data-page="${pageNum}"]`);
  activeBg.classList.add("active");

  currTextEl.classList.remove("show");
  await new Promise(res=>setTimeout(res,200));

  currTextEl.innerHTML = "";

  // P20 不显示文字
  if(pageNum === 20){
    currTextEl.classList.remove("show");
    homeTip.classList.add("show"); // P20 展示返回提示
  }else{
    renderTypeB(currData.html, currTextEl);
    currTextEl.classList.add("show");
    homeTip.classList.remove("show"); // 其他页面隐藏
  }

  updatePrevNext();

  await new Promise(res=>setTimeout(res,400));
  isAnimating=false;
  document.body.classList.remove("lock");
}

// 上半屏点击：上一页
hitTop.addEventListener("click",()=>{
  if(isAnimating || currentPage<=1) return;
  currentPage -=1;
  renderPage(currentPage);
});

// 下半屏点击：下一页，修改判断条件 currentPage >=20
hitBottom.addEventListener("click",()=>{
  if(isAnimating || currentPage>=20) return;
  currentPage +=1;
  renderPage(currentPage);
});

document.addEventListener('click',()=>{if(bgMusic.paused) bgMusic.play().catch(()=>{});},{once:true});
document.addEventListener('touchend',()=>{if(bgMusic.paused) bgMusic.play().catch(()=>{});},{once:true});

renderPage(currentPage);
</script>
</body>
