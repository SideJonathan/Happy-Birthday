<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>妈妈，生日快乐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap');

    * {
      font-family: 'Noto Serif SC', serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fce4ec;
    }

    body {
      position: relative;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
      /* hp页面：纯淡入入场，4.5s */
      animation: fadeIn 4.5s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: url('./background2.png') no-repeat center / cover;
    }

    /* ========== 光影流转层 ========== */
    .light-flow {
      position: fixed;
      inset:0;
      z-index:1.5;
      pointer-events:none;
      background: radial-gradient(circle at 20% 30%, rgba(255,220,225,0.35) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255,210,220,0.25) 0%, transparent 35%);
      animation: lightMove 12s ease-in-out infinite alternate;
    }
    @keyframes lightMove {
      0% { transform: translate(-6%,-4%); }
      100% { transform: translate(6%,4%); }
    }

    /* ========== 花瓣容器与花瓣动画 ========== */
    .petal-container {
      position: fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
      overflow:hidden;
    }
    .petal {
      position:absolute;
      background:#ffc8d2;
      border-radius:60% 40% 60% 40%;
      opacity:0.7;
      animation: petalFall linear forwards, petalSway ease-in-out infinite alternate;
    }
    @keyframes petalFall {
      0% {top:-15px; opacity:0.7;}
      90% {opacity:0.6;}
      100% {top:100vh; opacity:0;}
    }
    @keyframes petalSway {
      0% {transform:translateX(-25px) rotate(0deg);}
      100% {transform:translateX(25px) rotate(25deg);}
    }

    .blur-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      background: rgba(255, 255, 255, 0);
      transition: backdrop-filter 0.8s ease,
                  -webkit-backdrop-filter 0.8s ease,
                  background 0.8s ease;
      pointer-events: none;
    }

    .blur-layer.active {
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      background: rgba(255, 255, 255, 0.12);
    }

    .tip-layer {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    .tip-layer.show {
      opacity: 1;
    }

    .tip-text {
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(120, 30, 60, 0.55);
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      text-align: center;
      padding: 0 1.2rem;
      letter-spacing: 0.05em;
    }

    .char {
      opacity: 0;
      transform: translateY(14px);
      display: inline-block;
      animation: charShow 0.45s ease forwards;
    }

    @keyframes charShow {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 锁定遮罩 */
    .lock-mask {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: transparent;
      pointer-events: auto;
    }
    .lock-mask.unlock {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="lockMask" class="lock-mask"></div>

  <div class="stage">
    <div class="bg-image"></div>
  </div>

  <!-- 光影流转 -->
  <div class="light-flow"></div>
  <!-- 花瓣容器 -->
  <div class="petal-container" id="petalBox"></div>

  <div id="blurLayer" class="blur-layer"></div>

  <div id="tipLayer" class="tip-layer">
    <div id="tipText" class="tip-text"></div>
  </div>

  <script>
    const textStr = "向下滑动页面・进入回忆长廊";
    const tipDom = document.getElementById('tipText');
    const tipLayer = document.getElementById('tipLayer');
    const blurLayer = document.getElementById('blurLayer');
    const lockMask = document.getElementById('lockMask');
    const petalBox = document.getElementById('petalBox');

    let html = "";
    textStr.split('').forEach((ch, idx) => {
      html += `<span class="char" style="animation-delay:${idx * 0.08}s">${ch}</span>`;
    });
    tipDom.innerHTML = html;

    // 生成花瓣
    function createPetal(){
      const petal = document.createElement('div');
      petal.classList.add('petal');
      const size = Math.random() * 12 + 6;
      const fallTime = Math.random() * 8 + 7;
      petal.style.width = size + 'px';
      petal.style.height = size * 0.6 + 'px';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.top = '-15px';
      petal.style.animationDuration = `${fallTime}s, ${fallTime}s`;
      petal.style.transform = `rotate(${Math.random()*360}deg)`;
      petalBox.appendChild(petal);
      setTimeout(()=>petal.remove(), fallTime*1000);
    }
    setInterval(createPetal,350);

    // 5秒后开启模糊+文字
    setTimeout(() => {
      blurLayer.classList.add('active');
      tipLayer.classList.add('show');
    }, 5000);

    // 4.5s动画结束，解锁滑动交互
    setTimeout(() => {
      lockMask.classList.add('unlock');
    }, 4500);

    // ========== 下滑触发跳转 ==========
    let startY = 0;
    document.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if(!lockMask.classList.contains('unlock')) return;
      const endY = e.changedTouches[0].clientY;
      const diff = endY - startY;
      // 手指向下滑动，终点Y > 起点Y，差值大于60px触发
      if (diff > 60) {
        window.location.href = "./memory-journey-1.html";
      }
    });

    // 电脑端：鼠标滚轮向下滚动
    document.addEventListener('wheel', (e) => {
      if(!lockMask.classList.contains('unlock')) return;
      if (e.deltaY > 30) {
        window.location.href = "./memory-journey.html";
      }
    });
  </script>
</body>
</html>
